const rule = (n, text, sub) => `<div class="rulecard">
    <div class="rulebadge">RULE #${n}</div><div class="ruletext">${text}</div>
    ${sub ? `<div class="rulesub">${sub}</div>` : ""}</div>`;

/* Ten Days — Day 5: the signal box.
 *
 * Same template. This is the series' reversal episode: the radio loop that has
 * saved you every night plays its second half, and it is a warning. The plant
 * is "all rail staff evacuated on day one" (on the radio, as a badge); the
 * recall is "there is no driver" when a voice claims to be one.
 *
 * Deterministic throughout — no unseeded randomness anywhere.
 */

function figure(pose, x, y, s = 1, tone = "#1c2538") {
  const hood = "#2a3650", skin = "#d9b08c", pack = "#3a4a6a";
  let body;
  if (pose === "seat") {
    body = `<rect x="-70" y="-10" width="140" height="150" rx="34" fill="${hood}"/>
      <rect x="-50" y="60" width="60" height="110" rx="22" fill="${tone}"/>
      <circle cx="-8" cy="-50" r="52" fill="${hood}"/><circle cx="4" cy="-44" r="34" fill="${skin}"/>
      <rect x="-26" y="-56" width="56" height="26" rx="12" fill="${hood}"/>`;
  } else if (pose === "crouch") {
    body = `<rect x="-90" y="20" width="180" height="120" rx="48" fill="${hood}"/>
      <rect x="-100" y="-30" width="70" height="90" rx="26" fill="${pack}"/>
      <circle cx="30" cy="-30" r="50" fill="${hood}"/><circle cx="40" cy="-24" r="32" fill="${skin}"/>
      <rect x="6" y="-40" width="60" height="24" rx="12" fill="${hood}"/>`;
  } else if (pose === "back") {
    body = `<rect x="-62" y="-30" width="124" height="200" rx="40" fill="${hood}"/>
      <rect x="-40" y="-10" width="80" height="120" rx="24" fill="${pack}"/>
      <rect x="-44" y="160" width="34" height="110" rx="14" fill="${tone}"/>
      <rect x="10" y="160" width="34" height="100" rx="14" fill="${tone}"/>
      <circle cx="0" cy="-80" r="52" fill="${hood}"/>`;
  } else { // peer
    body = `<rect x="-64" y="-20" width="128" height="200" rx="40" fill="${hood}"/>
      <rect x="-104" y="-6" width="60" height="120" rx="24" fill="${pack}"/>
      <circle cx="14" cy="-68" r="54" fill="${hood}"/><circle cx="22" cy="-62" r="36" fill="${skin}"/>
      <rect x="-14" y="-78" width="64" height="26" rx="13" fill="${hood}"/>`;
  }
  return `<g transform="translate(${x},${y}) scale(${s})">${body}</g>`;
}

/* a railway line in perspective: two rails, sleepers, fences both sides */
function railway() {
  let h = `<div style="position:absolute;inset:0;background:linear-gradient(180deg,#070b14 0%,#0d1422 46%,#141b28 48%,#0b1119 100%);"></div>`;
  for (let i = 0; i < 16; i++) {
    const t = i / 15, y = 920 + Math.pow(t, 1.8) * 760, w = 40 + t * 700, hgt = 4 + t * 22;
    h += `<div style="position:absolute;left:${540 - w / 2}px;top:${y}px;width:${w}px;height:${hgt}px;border-radius:3px;background:#3a4560;opacity:${0.2 + t * 0.7};"></div>`;
  }
  h += `<svg width="1080" height="1920" style="position:absolute;inset:0;">
    <path d="M520,920 L300,1700" stroke="#6b7fa8" stroke-width="10" fill="none"/>
    <path d="M560,920 L780,1700" stroke="#6b7fa8" stroke-width="10" fill="none"/>
    <path d="M470,900 L60,1500" stroke="#2b3650" stroke-width="6" fill="none"/>
    <path d="M610,900 L1020,1500" stroke="#2b3650" stroke-width="6" fill="none"/>
  </svg>`;
  return h;
}

  <div style="position:absolute;left:0;right:0;top:330px;text-align:center;">
    <span id="drv" style="display:inline-block;color:var(--red);font-size:60px;font-weight:800;letter-spacing:8px;">DRIVER?</span></div>

mk("recall", `<div style="position:absolute;inset:0;background:#070c16;"></div>
  <div style="position:absolute;left:250px;top:720px;width:580px;height:290px;border-radius:16px;background:linear-gradient(180deg,#222d41,#161e2e);border:4px solid #33425e;">

      <span style="color:#ff6b6b;font-size:40px;font-weight:800;letter-spacing:3px;">CH 09</span></div>

mk("loop", `<div style="position:absolute;inset:0;background:#070c16;"></div>
  <!-- the loop as a waveform: the part you have always heard, then past it -->
  <div style="position:absolute;left:0;right:0;top:470px;text-align:center;color:#55617a;font-size:24px;letter-spacing:6px;">THE LOOP</div>
  <div style="position:absolute;left:90px;right:90px;top:760px;height:300px;display:flex;align-items:center;gap:6px;" id="wave">
    ${Array.from({ length: 60 }, (_, i) => { const hgt = 30 + ((i * 37) % 23) * 9; const past = i >= 34;
      return `<div class="wb" style="flex:1;height:${hgt}px;border-radius:4px;background:${past ? "var(--red)" : "#5aa9ff"};opacity:${past ? 0 : 0.9};"></div>`; }).join("")}
  </div>
  <div id="heremark" style="position:absolute;left:${90 + 34 * (900 / 60)}px;top:700px;width:4px;height:420px;background:#fff;"></div>
  <div style="position:absolute;left:${90 + 34 * (900 / 60) - 90}px;top:1140px;width:180px;text-align:center;color:#fff;font-size:22px;letter-spacing:4px;">AS FAR AS IT GOES</div>
  <div id="warnword" style="position:absolute;left:0;right:0;top:1230px;text-align:center;color:var(--red);font-size:84px;font-weight:800;letter-spacing:8px;opacity:0;">WARNING</div>
  <div class="vign"></div>`);


/* ---- end card: the question, the buttons, and the next day's hook ---- */
mk("end", `<div style="position:absolute;inset:0;
       background:radial-gradient(90% 60% at 50% 46%,#2a0b0b 0%,#07090f 72%);"></div>

const SH = [["recap", 0.0, 4.42], ["hook", 4.22, 12.51], ["bridge", 12.31, 17.89], ["rule1", 17.69, 23.24], ["obey1", 23.04, 28.29], ["plant", 28.09, 35.11], ["rule2", 34.91, 38.760000000000005], ["obey2", 38.56, 42.96], ["good", 42.76, 47.36], ["rule3", 47.16, 51.88], ["bad", 51.68, 57.410000000000004], ["inside", 57.21, 61.81], ["creak", 61.61, 65.48], ["voice", 65.28, 71.33], ["recall", 71.13, 79.86], ["loop", 79.66, 88.62], ["end", 88.42, 93.4]];
const FADE = 0.30;
SH.forEach(([id, a, b]) => {
  const el = document.getElementById(id);
  if (!el) { console.warn("missing panel", id); return; }
  tl.to(el, { opacity: 1, duration: FADE }, a);
  if (b < DUR) tl.to(el, { opacity: 0, duration: FADE }, b - FADE);
});

/* hook: push on you; the fuel readout pulses on "eleven miles" */
tl.fromTo("#hookfig", { scale: 1.0, transformOrigin: "50% 60%" }, { scale: 1.07, duration: 7.4, ease: "none" }, 4.3);
tl.fromTo("#fuel11", { scale: 1 }, { scale: 1.12, duration: 0.3, yoyo: true, repeat: 1 }, 7.0);
/* the map: every road draws into one bridge, then the queue backs up it */
["#r1","#r2","#r3","#r4","#r5"].forEach((id, i) => tl.fromTo(id, { drawSVG: "0% 0%" }, { drawSVG: "0% 100%", duration: 0.9, ease: "power1.inOut" }, 12.6 + i * 0.25));
tl.fromTo("#queue", { drawSVG: "0% 0%" }, { drawSVG: "0% 100%", duration: 1.6, ease: "power1.out" }, 14.7);
/* rule 1 obeyed: the line ahead drifts under you */
tl.fromTo("#rail", { scale: 1.0, transformOrigin: "50% 55%" }, { scale: 1.08, duration: 4.5, ease: "none" }, 23.2);
/* the plant */
tl.fromTo("#radiobox", { scale: 0.98 }, { scale: 1.04, duration: 6.2, ease: "none" }, 28.2);
tl.fromTo("#staffbadge", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 31.6);
/* rule 2 obeyed: bridges counted, one by one */
[39.5, 39.8, 40.1, 40.4].forEach((t, i) => {
  tl.set("#brcount", { textContent: String(i + 1) }, t);
  tl.to(`#br${i}`, { opacity: 1, duration: 0.2 }, t);
});
/* good news: the cab window breathes */
tl.to("#cabwin", { boxShadow: "0 0 70px rgba(240,169,60,.6)", duration: 1.2, yoyo: true, repeat: 3, ease: "sine.inOut" }, 43.0);
/* bad news: one door */
tl.fromTo("#onedoor", { scale: 1 }, { scale: 1.1, duration: 0.3, yoyo: true, repeat: 1 }, 55.6);
/* inside: the key board, found */
tl.fromTo("#keyboard", { boxShadow: "0 0 0 0 rgba(240,169,60,0)" }, { boxShadow: "0 0 30px 6px rgba(240,169,60,.4)", duration: 0.8 }, 59.8);
/* the creak: light comes UP the stairs behind you */
tl.fromTo("#stairlight", { height: 0 }, { height: 220, duration: 1.8, ease: "power2.out" }, 62.0);
/* the voice */
tl.set("#drv", { textContent: "" }, 65.4);
tl.to("#drv", { duration: 1.0, scrambleText: { text: "DRIVER?", chars: "upperCase", speed: 0.7 } }, 65.6);
/* the recall */
tl.fromTo("#nodriver", { scale: 1.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.32, ease: "power3.out" }, 77.0);
/* THE REVERSAL: the loop plays past where it ever has */
tl.to("#heremark", { opacity: 0.3, duration: 0.5, yoyo: true, repeat: 3 }, 80.0);
tl.to(".wb", { opacity: 1, duration: 0.12, stagger: 0.09, ease: "none" }, 81.6);
tl.fromTo("#warnword", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 85.8);

/* ---- HUD clock, stepping minute by minute ---- */
const S0 = 271, S1 = 308, AMPM = "AM";
const clockEl = document.getElementById("clock");
// seek(t, true) suppresses onUpdate as well as .call(), so neither survives a
// renderer grabbing frames out of order. Only tl.set() actually renders: it is
// a zero-duration tween, and tweens render at any playhead position.
for (let m = S0; m <= S1; m++){
  const at = ((m - S0) / Math.max(1, S1 - S0)) * (DUR - 4.0);
  tl.set(clockEl, { textContent:
    `${((Math.floor(m / 60) + 11) % 12) + 1}:${String(m % 60).padStart(2, "0")} ${AMPM}` }, at);
}

const LINES = [["YOU DROVE ON. THEIR LIGHTS<br>NEVER CAME <u>BACK</u>.", 0.25, 3.825], ["<b>DAY 5</b>. YOUR CAR HAS<br>ELEVEN MILES LEFT.", 4.425, 8.375], ["AND THE ROAD IS ABOUT TO<br><u>COST YOU THE CAR</u>.", 8.435, 11.76], ["ROADS SOUTH END HERE.<br>SIX MILES. <b>ONE BRIDGE</b>.", 12.51, 17.385], ["RULE 1. WALK THE SLEEPERS.<br>STONE IS <b>LOUD</b>.", 17.885, 22.885], ["YOU LEAVE ON YOUR TERMS.<br>AND TAKE THE <b>RAILWAY</b>.", 23.235, 27.735], ["RECOVERY IN <b>SIX DAYS</b>.<br><b>RAIL STAFF: GONE DAY 1</b>.", 28.285, 34.51], ["RULE 2. COUNT <b>BRIDGES</b>.<br>NOT MILES.", 35.11, 38.41], ["ELEVEN MILES. FOUR BRIDGES.<br>A <b>FREIGHT YARD</b>.", 38.76, 42.46], ["A LOCOMOTIVE. IDLING.<br><b>NOBODY</b> IN THE CAB.", 42.96, 46.76], ["RULE 3. NEVER SHELTER<br>ANYWHERE WITH <u>ONE DOOR</u>.", 47.36, 51.435], ["BETWEEN YOU AND THE TRAIN:<br>A SIGNAL BOX. <u>ONE DOOR</u>.", 51.885, 56.76], ["<b>4:55 AM</b>. YOU GO IN<br>FOR THE YARD KEYS.", 57.41, 61.31], ["THE STAIRCASE CREAKS.<br><u>BEHIND YOU</u>.", 61.81, 64.785], ["“DRIVER? THAT YOU?<br>COME <u>DOWN</u>.”", 65.485, 70.585], ["RAIL STAFF: GONE DAY 1.<br>THE RADIO <u>SAID SO</u>.", 71.335, 76.385], ["THERE IS <u>NO DRIVER</u>.", 76.835, 78.91], ["THEN THE LOOP PLAYS PAST<br>WHERE IT EVER HAS.", 79.86, 85.585], ["IT'S A <u>WARNING</u>.", 85.645, 87.47], ["", 88.62, 90.945]];
const capEl = document.getElementById("cap");
LINES.forEach(([html, a, b], i) => {
  tl.set(capEl, { innerHTML: html }, a);   // render-time, survives seek
  tl.fromTo(capEl, { opacity: 0, y: 14 },
            { opacity: html ? 1 : 0, duration: 0.26, ease: "power2.out" }, a);
  const next = LINES[i + 1] ? LINES[i + 1][1] : DUR;
  tl.to(capEl, { opacity: 0, duration: 0.20 }, Math.min(b, next - 0.24));
});

window.__timelines = window.__timelines || {};
window.__timelines["td5"] = tl;
