<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Forty-Two Rupees</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
  :root { --ink:#1b1410; --cream:#fff6e8; }
  html,body { margin:0; background:#000; }
  #root { position:relative; width:1080px; height:1920px; overflow:hidden;
          background:#000; font-family:"Avenir Next","Helvetica Neue",sans-serif; }
  .plate { position:absolute; inset:0; opacity:0; will-change:opacity; }
  .plate img { position:absolute; left:50%; top:50%; width:1080px; height:1920px;
               margin:-960px 0 0 -540px; object-fit:cover; will-change:transform; }
  /* warm grade + vignette: the plates are flat out of the model and this is what
     makes ten unrelated renders read as one film */
  #grade { position:absolute; inset:0; pointer-events:none;
           background:
             radial-gradient(118% 80% at 50% 42%, rgba(0,0,0,0) 48%, rgba(10,6,2,.62) 100%),
             linear-gradient(180deg, rgba(255,176,92,.10) 0%, rgba(0,0,0,0) 34%,
                             rgba(0,0,0,0) 62%, rgba(24,10,2,.40) 100%); }
  #capwrap { position:absolute; left:84px; right:84px; top:196px; text-align:center; }
  #cap { display:inline-block; color:#fff; font-size:52px; line-height:1.3;
         font-weight:600; letter-spacing:.2px; opacity:0;
         text-shadow:0 3px 18px rgba(0,0,0,.85), 0 1px 3px rgba(0,0,0,.9); }
  #progress { position:absolute; left:0; bottom:0; height:5px; width:0;
              background:linear-gradient(90deg,#ffb45c,#ffe3b0); opacity:.85; }
</style>
  </head>
  <body>
<div id="root" data-composition-id="ep02" data-start="0" data-duration="52.6"
     data-width="1080" data-height="1920"
     data-track-kind="graphics">
  <div id="plates" class="clip" data-start="0" data-duration="52.6" data-track-index="0"></div>
  <div id="grade"  class="clip" data-start="0" data-duration="52.6" data-track-index="1"
       data-layout-ignore></div>
  <div id="capwrap" class="clip" data-start="0" data-duration="52.6" data-track-index="2"
       data-track-kind="captions"><span id="cap"></span></div>
  <div id="progress" class="clip" data-start="0" data-duration="52.6" data-track-index="3"
       data-layout-ignore></div>
</div>

<audio id="vo" src="assets/audio/mix.wav" data-start="0" data-volume="1"></audio>

<script>
  const DUR = 52.6;
  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#progress", { width: 0 }, { width: 1080, duration: DUR, ease: "none" }, 0);

  // Stills are all the motion we have, so the camera never rests and every move
  // is bigger than it would be over footage: 18-32% travel, not the 6-10% an
  // explainer uses. from/to are [scale, x, y].
  const SHOTS = [
    { img:"e01", in:0.0,  out:9.05, from:[1.28,  55,  30], to:[1.04, -35, -22] },
    { img:"e02", in:8.85, out:12.30,from:[1.04,   0,  25], to:[1.28,   0, -28] },
    { img:"e03", in:12.10,out:14.95,from:[1.26, -40, -20], to:[1.06,  30,  20] },
    { img:"e04", in:14.75,out:19.60,from:[1.05,  25,  20], to:[1.30, -30, -24] },
    { img:"e05", in:19.40,out:23.30,from:[1.34,   0,  34], to:[1.04,   0, -26] },
    { img:"e06", in:23.10,out:31.55,from:[1.04, -35, -25], to:[1.36,  45,  30] },
    { img:"e07", in:31.35,out:35.30,from:[1.28,  40,  22], to:[1.05, -30, -20] },
    { img:"e08", in:35.10,out:37.80,from:[1.06,   0, -22], to:[1.26,   0,  24] },
    { img:"e09", in:37.60,out:43.20,from:[1.30, -30,  25], to:[1.06,  35, -22] },
    // the turn: hold on her face and push the whole way in
    { img:"e10", in:43.00,out:DUR,  from:[1.06,   0,  18], to:[1.40,   0, -30] },
  ];

  const platesEl = document.getElementById("plates");
  SHOTS.forEach((s, i) => {
    const d = document.createElement("div");
    d.className = "plate"; d.id = `plate${i}`;
    const im = document.createElement("img");
    im.src = `assets/shots/${s.img}.png`;
    d.appendChild(im); platesEl.appendChild(d);

    const FADE = 0.55;                       // slow dissolves suit the mood
    tl.to(d, { opacity: 1, duration: FADE }, s.in);
    if (s.out < DUR) tl.to(d, { opacity: 0, duration: FADE }, s.out - FADE);
    tl.fromTo(im,
      { scale: s.from[0], x: s.from[1], y: s.from[2] },
      { scale: s.to[0], x: s.to[1], y: s.to[2], duration: s.out - s.in, ease: "none" },
      s.in);
  });

  // One line at a time, matching the reference reels' plain white sentence.
  // Times are the measured VO timings, never estimates.
  const LINES = [
    ["Nine days left. Anaya had a plan.",                            0.30,  3.85],
    ["Under her bed was a tin.",                                     3.91,  6.30],
    ["She had been filling it since the rains.",                     6.30,  8.66],
    ["She tipped it out onto the floor.",                            9.20, 11.97],
    ["Forty-two rupees.",                                           12.40, 14.70],
    ["She counted it again, just to be sure. Forty-two.",           15.00, 19.15],
    ["A proper welcome needs three things.",                        20.00, 23.02],
    ["Firecrackers, so the whole street knows he is home.",         23.40, 27.38],
    ["His favourite lunch. And a present.",                         28.00, 31.07],
    ["Forty-two rupees buys one of them.",                          32.00, 35.05],
    ["Only one.",                                                   35.40, 37.33],
    ["So she picked up her pencil, and crossed out the present.",   37.60, 41.60],
    ["Then she stopped.",                                           43.00, 45.10],
    ["And she un-crossed it.",                                      45.40, 47.77],
    ["She would find a way to get all three.",                      48.20, 51.40],
  ];
  const capEl = document.getElementById("cap");
  LINES.forEach(([text, a, b], i) => {
    tl.call(() => { capEl.textContent = text; }, null, a);
    tl.fromTo(capEl, { opacity: 0, y: 16 },
              { opacity: 1, y: 0, duration: 0.34, ease: "power2.out" }, a);
    const next = LINES[i + 1] ? LINES[i + 1][1] : DUR;
    tl.to(capEl, { opacity: 0, duration: 0.26 }, Math.min(b, next - 0.30));
  });

  window.__timelines = window.__timelines || {};
  window.__timelines["ep02"] = tl;
</script>
  </body>
</html>
