<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>The Girl Who Waited</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
  :root { --ink:#1b1410; --cream:#fff6e8; }
  html,body { margin:0; background:#000; }
  #root { position:relative; width:1080px; height:1920px; overflow:hidden;
          background:#000; font-family:"Avenir Next","Helvetica Neue",sans-serif; }
  .plate { position:absolute; inset:0; opacity:0; will-change:opacity; }
  .plate img { position:absolute; left:50%; top:50%; width:1080px; height:1920px;
               margin:-960px 0 0 -540px; object-fit:cover; will-change:transform; }
  /* warm grade + vignette: the plates are flat out of the model and this is what
     makes ten unrelated renders read as one film */
  #grade { position:absolute; inset:0; pointer-events:none;
           background:
             radial-gradient(118% 80% at 50% 42%, rgba(0,0,0,0) 48%, rgba(10,6,2,.62) 100%),
             linear-gradient(180deg, rgba(255,176,92,.10) 0%, rgba(0,0,0,0) 34%,
                             rgba(0,0,0,0) 62%, rgba(24,10,2,.40) 100%); }
  #capwrap { position:absolute; left:84px; right:84px; top:196px; text-align:center; }
  #cap { display:inline-block; color:#fff; font-size:52px; line-height:1.3;
         font-weight:600; letter-spacing:.2px; opacity:0;
         text-shadow:0 3px 18px rgba(0,0,0,.85), 0 1px 3px rgba(0,0,0,.9); }
  #progress { position:absolute; left:0; bottom:0; height:5px; width:0;
              background:linear-gradient(90deg,#ffb45c,#ffe3b0); opacity:.85; }
</style>
  </head>
  <body>
<div id="root" data-composition-id="waited" data-start="0" data-duration="51.4"
     data-width="1080" data-height="1920"
     data-track-kind="graphics">
  <div id="plates" class="clip" data-start="0" data-duration="51.4" data-track-index="0"></div>
  <div id="grade"  class="clip" data-start="0" data-duration="51.4" data-track-index="1"
       data-layout-ignore></div>
  <div id="capwrap" class="clip" data-start="0" data-duration="51.4" data-track-index="2"
       data-track-kind="captions"><span id="cap"></span></div>
  <div id="progress" class="clip" data-start="0" data-duration="51.4" data-track-index="3"
       data-layout-ignore></div>
</div>

<audio id="vo" src="assets/audio/mix.wav" data-start="0" data-volume="1"></audio>

<script>
  const DUR = 51.4;
  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#progress", { width: 0 }, { width: 1080, duration: DUR, ease: "none" }, 0);

  // Stills are all the motion we have, so the camera never rests and every move
  // is bigger than it would be over footage: 18-32% travel, not the 6-10% an
  // explainer uses. from/to are [scale, x, y].
  const SHOTS = [
    { img:"w01", in:0.0,  out:3.95, from:[1.30,  60,  30], to:[1.06, -30, -20] },
    { img:"w02", in:3.75, out:6.70, from:[1.04,   0,  20], to:[1.26,   0, -30] },
    { img:"w03", in:6.50, out:11.60,from:[1.26, -50, -30], to:[1.04,  40,  25] },
    { img:"w04", in:11.40,out:14.30,from:[1.06,  30, -20], to:[1.30, -40,  20] },
    { img:"w05", in:14.10,out:17.80,from:[1.28,   0, -35], to:[1.05,   0,  25] },
    { img:"w06", in:17.60,out:21.45,from:[1.05, -40,  25], to:[1.28,  35, -20] },
    { img:"w07", in:21.25,out:25.75,from:[1.30,  45,  25], to:[1.06, -35, -25] },
    { img:"w08", in:25.55,out:33.70,from:[1.04, -30, -25], to:[1.34,  45,  30] },
    { img:"w09", in:33.40,out:40.10,from:[1.32,   0,  30], to:[1.06,   0, -25] },
    { img:"w11", in:39.90,out:46.50,from:[1.06,   0,  25], to:[1.30,   0, -28] },
    // the reroll: mid-run, hair moving. The one plate in the set with real energy,
    // so it gets the hardest push of the film.
    { img:"w10c",in:46.30,out:DUR,  from:[1.08,   0,  20], to:[1.42,   0, -34] },
  ];

  const platesEl = document.getElementById("plates");
  SHOTS.forEach((s, i) => {
    const d = document.createElement("div");
    d.className = "plate"; d.id = `plate${i}`;
    const im = document.createElement("img");
    im.src = `assets/shots/${s.img}.png`;
    d.appendChild(im); platesEl.appendChild(d);

    const FADE = 0.55;                       // slow dissolves suit the mood
    tl.to(d, { opacity: 1, duration: FADE }, s.in);
    if (s.out < DUR) tl.to(d, { opacity: 0, duration: FADE }, s.out - FADE);
    tl.fromTo(im,
      { scale: s.from[0], x: s.from[1], y: s.from[2] },
      { scale: s.to[0], x: s.to[1], y: s.to[2], duration: s.out - s.in, ease: "none" },
      s.in);
  });

  // One line at a time, matching the reference reels' plain white sentence.
  // Times are the measured VO timings, never estimates.
  const LINES = [
    ["Every evening, Anaya waited at the window.",       0.30,  3.85],
    ["She was waiting for her father.",                  3.91,  6.56],
    ["He had gone far away to work.",                    6.80,  9.20],
    ["One more cross on the calendar.",                  9.20, 11.47],
    ["Dinner was quieter now.",                         11.60, 14.15],
    ["So she kept his photograph close.",               14.60, 17.62],
    ["Some nights, she fell asleep by the door.",       18.00, 21.27],
    ["And when it rained, she wondered if he was cold.",22.00, 25.57],
    ["She drew him a picture. Four people, one house.", 26.20, 29.98],
    ["Two hundred and eleven days.",                    30.60, 33.50],
    ["Then one morning, she heard a sound at the gate.",33.60, 37.17],
    ["But it wasn't him.",                              37.80, 39.95],
    ["It was a letter.",                                40.20, 42.23],
    ["Papa is coming home. In ten days.",               42.60, 46.10],
    ["Ten days. And forty-two rupees.",                 46.60, 49.90],
  ];
  const capEl = document.getElementById("cap");
  LINES.forEach(([text, a, b], i) => {
    tl.set(capEl, { textContent: text }, a);   // set() renders on seek; call() does not
    tl.fromTo(capEl, { opacity: 0, y: 16 },
              { opacity: 1, y: 0, duration: 0.34, ease: "power2.out" }, a);
    const next = LINES[i + 1] ? LINES[i + 1][1] : DUR;
    tl.to(capEl, { opacity: 0, duration: 0.26 }, Math.min(b, next - 0.30));
  });

  window.__timelines = window.__timelines || {};
  window.__timelines["waited"] = tl;
</script>
  </body>
</html>
