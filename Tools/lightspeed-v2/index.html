<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ink: #05060a;
        --gold: #f5b53d;
        --white: #ffffff;
        --red: #e3372f;
        --font: "Poppins", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); font-family: var(--font); }
      .clip { position: absolute; inset: 0; }

      /* full-bleed photoreal plate + slow camera move */
      .plate { position: absolute; inset: 0; overflow: hidden; opacity: 0; }
      .plate img {
        position: absolute; left: 50%; top: 50%;
        width: 1350px; height: 2400px; margin: -1200px 0 0 -675px;
        object-fit: cover; will-change: transform;
      }
      /* vignette + top/bottom grade so type always reads */
      .grade {
        position: absolute; inset: 0;
        background:
          linear-gradient(to bottom, rgba(5,6,10,.86) 0%, rgba(5,6,10,.20) 22%, rgba(5,6,10,0) 38%),
          linear-gradient(to top,    rgba(5,6,10,.92) 0%, rgba(5,6,10,.55) 22%, rgba(5,6,10,0) 46%),
          radial-gradient(130% 80% at 50% 50%, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 100%);
      }

      /* top title block — gold headline + small sub, per reference */
      #titlewrap { position: absolute; left: 70px; right: 70px; top: 190px; text-align: center; }
      #title {
        font-size: 78px; font-weight: 800; color: var(--gold); line-height: 1.02;
        letter-spacing: -0.02em; text-shadow: 0 6px 34px rgba(0,0,0,.85); opacity: 0;
      }
      #subtitle {
        margin-top: 14px; font-size: 32px; font-weight: 600; color: rgba(255,255,255,.88);
        text-shadow: 0 4px 20px rgba(0,0,0,.9); opacity: 0;
      }

      /* big number callout */
      #statwrap { position: absolute; left: 70px; right: 70px; top: 760px; text-align: center; }
      #statwrap.on::before { opacity: 1; }
      #statwrap::before {
        content: ""; position: absolute; left: -70px; right: -70px; top: -70px; bottom: -60px;
        background: radial-gradient(60% 55% at 50% 50%, rgba(5,6,10,.80) 0%, rgba(5,6,10,.45) 55%, rgba(5,6,10,0) 100%);
        opacity: 0; pointer-events: none;
      }
      #stat {
        font-size: 150px; font-weight: 800; color: var(--gold); line-height: 1;
        text-shadow: 0 10px 50px rgba(0,0,0,.95), 0 3px 10px rgba(0,0,0,.95), 0 0 70px rgba(0,0,0,.8);
        opacity: 0;
      }
      #statsub {
        margin-top: 10px; font-size: 36px; font-weight: 800; color: #fff; letter-spacing: .04em;
        text-shadow: 0 4px 16px rgba(0,0,0,1), 0 2px 5px rgba(0,0,0,1), 0 0 40px rgba(0,0,0,.95);
        opacity: 0;
      }

      /* bottom caption band — white with a gold keyword, per reference */
      #caps { position: absolute; left: 60px; right: 60px; top: auto; bottom: 300px; height: 230px; }
      .cg {
        position: absolute; inset: 0;
        display: flex; flex-wrap: wrap; justify-content: center; align-content: center;
        gap: 14px 24px; opacity: 0;
      }
      .cw {
        font-size: 60px; font-weight: 800; color: var(--white);
        text-shadow: 0 5px 26px rgba(0,0,0,.95), 0 2px 6px rgba(0,0,0,.9);
        transform: scale(1);
      }
      .cw.hot { color: var(--gold); }



      #progress { position: absolute; left: 0; top: auto; bottom: 0; height: 7px; width: 0;
                  background: linear-gradient(to right, var(--gold), #ff7a3d); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="ls2" data-start="0" data-duration="57.4"
         data-width="1080" data-height="1920" data-track-kind="graphics">

      <div id="plates" class="clip" data-start="0" data-duration="57.4" data-track-index="0"></div>
      <div id="grade" class="clip grade" data-start="0" data-duration="57.4" data-track-index="1"
           data-layout-ignore></div>

      <div id="titlewrap" class="clip" data-start="0" data-duration="57.4" data-track-index="2">
        <div id="title"></div>
        <div id="subtitle"></div>
      </div>

      <div id="statwrap" class="clip" data-start="0" data-duration="57.4" data-track-index="3">
        <div id="stat"></div>
        <div id="statsub"></div>
      </div>

      <div id="caps" class="clip" data-start="0" data-duration="57.4"
           data-track-index="4" data-track-kind="captions"></div>


      <div id="progress" class="clip" data-start="0" data-duration="57.4" data-track-index="7"
           data-layout-ignore></div>
    </div>

    <audio id="vo" src="assets/audio/mix.wav" data-start="0" data-volume="1"></audio>

    <script>
      const DUR = 57.4;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#progress", { width: 0 }, { width: 1080, duration: DUR, ease: "none" }, 0);

      // ---- shot list: photoreal plate + slow camera move, cross-dissolved ----
      const SHOTS = [
        { img: "sun_surface", in: 0.0,   out: 5.6,  from: [1.00, 0, 0],    to: [1.16, 0, -40] },
        { img: "spacecraft",  in: 5.3,   out: 9.9,  from: [1.14, 40, 0],   to: [1.00, -30, 20] },
        { img: "starfield",   in: 9.6,   out: 13.5, from: [1.02, -30, -20],to: [1.18, 30, 20] },
        { img: "milkyway",    in: 13.2,  out: 17.7, from: [1.16, 30, 30],  to: [1.00, -20, -20] },
        { img: "sun_surface", in: 17.4,  out: 21.5, from: [1.22, -20, 0],  to: [1.40, 10, 10] },
        { img: "nebula",      in: 21.2,  out: 24.4, from: [1.00, 0, 20],   to: [1.18, -25, -15] },
        { img: "aurora",      in: 24.1,  out: 28.8, from: [1.16, 25, -10], to: [1.00, -25, 10] },
        { img: "starfield",   in: 28.5,  out: 32.2, from: [1.00, 0, 0],    to: [1.38, 0, 0] },
        { img: "milkyway",    in: 31.9,  out: 36.5, from: [1.30, -20, 10], to: [1.06, 20, -10] },
        { img: "earth_limb",  in: 36.2,  out: 38.4, from: [1.08, 0, 10],   to: [1.18, 0, -10] },
        { img: "andromeda",   in: 38.1,  out: 42.0, from: [1.20, -30, 0],  to: [1.02, 30, 0] },
        { img: "earth_full",  in: 41.7,  out: 45.0, from: [1.02, 0, 0],    to: [1.16, 10, -15] },
        { img: "earth_night", in: 44.7,  out: 50.7, from: [1.18, 25, 15],  to: [1.00, -25, -15] },
        { img: "earth_limb",  in: 50.4,  out: DUR,  from: [1.00, 0, -10],  to: [1.20, 0, 14] },
      ];

      const platesEl = document.getElementById("plates");
      SHOTS.forEach((s, i) => {
        const d = document.createElement("div");
        d.className = "plate";
        d.id = `plate${i}`;
        const im = document.createElement("img");
        im.src = `assets/shots/${s.img}.jpg`;
        d.appendChild(im);
        platesEl.appendChild(d);

        const FADE = 0.45;
        tl.to(d, { opacity: 1, duration: FADE }, s.in);
        if (s.out < DUR) tl.to(d, { opacity: 0, duration: FADE }, s.out - FADE);
        // slow push / drift for the whole shot — the camera never sits still
        tl.fromTo(im,
          { scale: s.from[0], x: s.from[1], y: s.from[2] },
          { scale: s.to[0], x: s.to[1], y: s.to[2], duration: s.out - s.in, ease: "none" },
          s.in);
      });

      // ---- title cards ----
      const TITLES = [
        { t: 1.3,  u: 5.8,  a: "300,000 KM/S",       b: "light, in a vacuum" },
        { t: 13.5, u: 17.4, a: "THE POSTULATE",       b: "c measures the same for every observer" },
        { t: 17.7, u: 24.0, a: "THE ENERGY WALL",     b: "cost climbs without limit near c" },
        { t: 28.8, u: 31.9, a: "ABERRATION",          b: "starlight bends toward your heading" },
        { t: 32.2, u: 36.2, a: "LORENTZ CONTRACTION", b: "the distance ahead physically shrinks" },
        { t: 38.3, u: 41.7, a: "ANDROMEDA",           b: "2,500,000 light years out" },
        { t: 44.9, u: 50.3, a: "NO WAY BACK",         b: "the trip only runs forward in time" },
      ];
      const titleEl = document.getElementById("title");
      const subEl = document.getElementById("subtitle");
      TITLES.forEach((x) => {
        tl.set(titleEl, { innerText: x.a }, x.t);
        tl.set(subEl, { innerText: x.b }, x.t);
        tl.fromTo(titleEl, { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.32 }, x.t);
        tl.fromTo(subEl, { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.32 }, x.t + 0.12);
        tl.to(titleEl, { opacity: 0, duration: 0.25 }, x.u - 0.25);
        tl.to(subEl, { opacity: 0, duration: 0.25 }, x.u - 0.25);
      });

      // ---- big number moments ----
      const STATS = [
        { t: 24.3, u: 28.5, a: "99.9%", b: "OF LIGHT SPEED" },
        { t: 38.5, u: 41.7, a: "28", b: "YEARS ABOARD" },
        { t: 42.0, u: 44.7, a: "2,500,000", b: "YEARS ON EARTH" },
      ];
      const statEl = document.getElementById("stat");
      const statSubEl = document.getElementById("statsub");
      STATS.forEach((x) => {
        tl.set(statEl, { innerText: x.a }, x.t);
        tl.set(statSubEl, { innerText: x.b }, x.t);
        tl.set("#statwrap", { className: "clip on" }, x.t);
        tl.set("#statwrap", { className: "clip" }, x.u);
        tl.fromTo(statEl, { opacity: 0, scale: 1.25 },
                  { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, x.t);
        tl.fromTo(statSubEl, { opacity: 0 }, { opacity: 1, duration: 0.3 }, x.t + 0.18);
        tl.to(statEl, { opacity: 0, duration: 0.25 }, x.u - 0.25);
        tl.to(statSubEl, { opacity: 0, duration: 0.25 }, x.u - 0.25);
      });


      // ---- captions: white line, gold keyword, sentence-grouped ----
      const HOT = new Set(["three","hundred","thousand","kilometres","second","exactly","same","speed",
        "rule","universe","infinite","energy","star","ninety","nine","percent","bends","tunnel","fire",
        "contracts","weeks","slows","Andromeda","twenty","eight","million","gone","one","way","door",
        "future","without","thinking"]);
      const ALL = [["Switch", 0.0, 0.42, false], ["on", 0.42, 0.55, false], ["a", 0.55, 0.62, false], ["torch", 0.62, 1.21, true], ["That", 1.21, 1.8, false], ["light", 1.8, 1.82, false], ["leaves", 1.82, 2.26, false], ["you", 2.26, 2.43, false], ["at", 2.43, 2.56, false], ["three", 2.56, 2.98, false], ["hundred", 2.98, 3.4, false], ["thousand", 3.4, 3.82, false], ["kilometres", 3.82, 4.24, false], ["per", 4.66, 4.87, false], ["second", 4.87, 5.5, true], ["Now", 5.5, 5.71, false], ["chase", 5.71, 6.05, false], ["it", 6.05, 6.4, true], ["Run", 6.4, 6.61, false], ["at", 6.61, 6.74, false], ["half", 6.74, 7.03, false], ["the", 7.03, 7.23, false], ["speed", 7.23, 7.58, false], ["of", 7.58, 7.71, false], ["light", 7.71, 8.06, true], ["and", 8.06, 8.27, false], ["measure", 8.27, 8.75, false], ["the", 8.75, 9.15, false], ["beam", 9.15, 9.4, false], ["again", 9.4, 9.83, true], ["It", 9.83, 9.93, false], ["is", 9.93, 10.06, false], ["still", 10.06, 10.46, false], ["running", 10.46, 10.9, false], ["away", 10.9, 11.25, false], ["from", 11.25, 11.45, false], ["you", 11.45, 11.66, false], ["at", 11.66, 11.8, false], ["exactly", 11.8, 12.27, false], ["the", 12.27, 12.77, false], ["same", 12.77, 12.78, false], ["speed", 12.78, 13.37, true], ["That", 13.37, 13.6, false], ["is", 13.6, 13.74, false], ["not", 13.74, 13.95, false], ["a", 13.95, 14.05, false], ["flaw", 14.05, 14.43, false], ["in", 14.43, 14.53, false], ["your", 14.53, 14.7, false], ["rocket", 14.7, 15.34, true], ["It", 15.34, 15.47, false], ["is", 15.47, 15.6, false], ["a", 15.6, 15.67, false], ["rule", 15.67, 15.95, false], ["the", 15.95, 16.2, false], ["universe", 16.2, 16.73, false], ["is", 16.73, 17.01, false], ["built", 17.01, 17.19, false], ["on", 17.19, 17.54, true], ["To", 17.54, 17.67, false], ["actually", 17.67, 18.29, false], ["reach", 18.29, 18.57, false], ["light", 18.57, 18.91, false], ["speed", 18.91, 19.39, true], ["you", 19.39, 19.6, false], ["would", 19.6, 19.95, false], ["need", 19.95, 20.2, false], ["infinite", 20.2, 20.86, false], ["energy", 20.86, 21.41, true], ["Every", 21.41, 21.75, false], ["engine", 21.75, 22.18, false], ["ever", 22.18, 22.45, false], ["built", 22.45, 22.83, false], ["would", 22.83, 23.35, false], ["not", 23.35, 23.4, false], ["be", 23.4, 23.54, false], ["enough", 23.54, 24.21, true], ["But", 24.21, 24.61, false], ["push", 24.61, 24.62, false], ["close", 24.62, 25.08, true], ["ninety", 25.08, 25.23, false], ["nine", 25.23, 25.38, false], ["point", 25.38, 25.53, false], ["nine", 25.53, 25.68, false], ["percent", 25.68, 25.83, true], ["and", 25.83, 25.98, false], ["reality", 26.13, 26.61, false], ["bends", 26.61, 27.0, false], ["to", 27.0, 27.09, false], ["let", 27.09, 27.34, false], ["you", 27.34, 27.51, false], ["through", 27.51, 28.7, true], ["The", 28.7, 29.07, false], ["stars", 29.07, 29.32, false], ["ahead", 29.32, 29.71, false], ["squeeze", 29.71, 30.51, false], ["into", 30.51, 30.58, false], ["a", 30.58, 30.69, false], ["tunnel", 30.69, 31.13, false], ["of", 31.13, 31.28, false], ["blue", 31.28, 31.6, false], ["fire", 31.6, 32.07, true], ["Space", 32.07, 32.46, false], ["itself", 32.46, 32.93, false], ["contracts", 32.93, 33.93, true], ["A", 33.93, 33.94, false], ["four", 33.94, 34.26, false], ["light", 34.26, 34.92, false], ["year", 34.92, 35.05, false], ["trip", 35.05, 35.28, false], ["shrinks", 35.28, 35.83, false], ["to", 35.83, 35.98, false], ["weeks", 35.98, 36.37, true], ["And", 36.37, 36.6, false], ["your", 36.6, 36.92, false], ["clock", 36.92, 37.31, false], ["slows", 37.31, 37.94, false], ["down", 37.94, 38.25, true], ["Fly", 38.25, 38.48, false], ["to", 38.48, 38.63, false], ["Andromeda", 38.63, 39.34, true], ["and", 39.34, 39.57, false], ["you", 39.57, 39.8, false], ["step", 39.8, 40.11, false], ["out", 40.11, 40.34, false], ["after", 40.34, 40.73, false], ["twenty", 40.73, 40.98, false], ["eight", 40.98, 41.23, false], ["years", 41.47, 41.83, true], ["Earth", 41.83, 42.22, false], ["would", 42.22, 42.61, false], ["have", 42.61, 43.22, false], ["aged", 43.22, 43.24, false], ["two", 43.24, 43.47, false], ["and", 43.47, 43.7, false], ["a", 43.7, 43.78, false], ["half", 43.78, 44.09, false], ["million", 44.09, 44.9, true], ["Everyone", 44.9, 45.71, false], ["you", 45.71, 45.74, false], ["knew", 45.74, 46.05, true], ["gone", 46.05, 46.6, true], ["Their", 46.6, 46.99, false], ["cities", 46.99, 47.25, true], ["gone", 47.51, 48.07, true], ["Light", 48.07, 48.4, false], ["speed", 48.4, 48.79, false], ["was", 48.79, 48.95, false], ["never", 48.95, 49.49, false], ["a", 49.49, 49.56, false], ["speed", 49.56, 49.88, false], ["limit", 49.88, 50.53, true], ["It", 50.53, 50.66, false], ["is", 50.66, 50.81, false], ["a", 50.81, 50.89, false], ["one", 50.89, 51.06, false], ["way", 51.06, 51.24, false], ["door", 51.42, 52.05, false], ["into", 52.05, 52.1, false], ["the", 52.1, 52.31, false], ["future", 52.31, 52.98, true], ["And", 52.98, 53.32, false], ["it", 53.32, 53.36, false], ["all", 53.36, 53.59, false], ["starts", 53.59, 54.06, false], ["with", 54.06, 54.38, false], ["something", 54.38, 55.08, false], ["you", 55.08, 55.31, false], ["do", 55.31, 55.47, false], ["without", 55.47, 56.04, false], ["thinking", 56.04, 57.4, true]];
      const caps = document.getElementById("caps");
      const MAXW = 4;
      const G = [];
      let cur = [];
      ALL.forEach((w) => { cur.push(w); if (w[3] || cur.length >= MAXW) { G.push(cur); cur = []; } });
      if (cur.length) G.push(cur);

      G.forEach((g, gi) => {
        const start = g[0][1];
        const next = gi < G.length - 1 ? G[gi + 1][0][1] : DUR;
        const out = Math.max(start + 0.2, next - 0.14);
        const el = document.createElement("div");
        el.className = "cg";
        caps.appendChild(el);
        const ws = g.map((w) => {
          const s = document.createElement("span");
          s.className = "cw" + (HOT.has(w[0]) ? " hot" : "");
          s.textContent = w[0];
          el.appendChild(s);
          return { el: s, a: w[1], b: w[2] };
        });
        tl.to(el, { opacity: 1, duration: 0.06 }, start);
        ws.forEach(({ el: e, a, b }) => {
          tl.to(e, { scale: 1.07, duration: 0.08 }, a);
          tl.to(e, { scale: 1, duration: 0.12 }, b);
        });
        tl.to(el, { opacity: 0, duration: 0.07 }, out);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines["ls2"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
