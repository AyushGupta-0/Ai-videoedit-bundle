    <div class="rulebadge">RULE #${n}</div><div class="ruletext">${text}</div>
    ${sub ? `<div class="rulesub">${sub}</div>` : ""}</div>`;

/* A parking level in perspective: slab above, slab below, pillars receding.
   Deterministic throughout — the renderer seeks frames out of order. */
function level(litIndex){
  let h = "";
  for (let i = 0; i < 6; i++){
    const t = i / 5;
    const x = 120 + t * 430, w = 60 - t * 34, top = 620 + t * 120, hgt = 700 - t * 300;
    for (const side of [0, 1]){
      const px = side ? 1080 - x - w : x;
      h += `<div style="position:absolute;left:${px}px;top:${top}px;width:${w}px;height:${hgt}px;
             background:linear-gradient(90deg,#333c4e,#222a38);opacity:${1 - t*0.45};"></div>`;
    }
  }
  // parked cars down both sides, one of them lit
  for (let i = 0; i < 5; i++){
    const t = i / 4;
    const w = 300 - t * 180, hh = 120 - t * 72;
    const y = 1180 - t * 300;
    for (const side of [0, 1]){
      const x = side ? 1080 - (96 + t * 300) - w : 96 + t * 300;
      const lit = (i * 2 + side) === litIndex;
      h += `<div style="position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${hh}px;
             border-radius:${10 - t*5}px;background:${lit
               ? "linear-gradient(180deg,#4b4426,#2c2714)" : "linear-gradient(180deg,#2d384f,#1c2433)"};
             opacity:${0.95 - t*0.35};"></div>
            <div style="position:absolute;left:${x + w*0.16}px;top:${y - hh*0.40}px;
             width:${w*0.68}px;height:${hh*0.44}px;border-radius:${7-t*3}px ${7-t*3}px 0 0;
             background:${lit ? "#5c5230" : "#36425c"};opacity:${0.9 - t*0.35};"></div>`;
    }
  }
  return h;
}

const SH = [["recap", 0.0, 2.5500000000000003], ["park", 2.35, 9.059999999999999], ["ramp", 8.86, 14.63], ["dash", 14.29, 19.62], ["radio", 19.42, 25.52], ["rule1", 25.32, 28.75], ["rule2", 28.41, 33.13], ["rule3", 32.79, 37.14], ["good", 36.94, 41.57], ["bad", 41.22, 47.0], ["door", 46.8, 55.760000000000005], ["steps", 55.56, 59.160000000000004], ["voice", 58.96, 63.96], ["dash2", 63.76, 68.39], ["count", 68.19, 74.51], ["end", 74.31, 78.8]];
const FADE = 0.30;
SH.forEach(([id, a, b]) => {
  const el = document.getElementById(id);
  if (!el) { console.warn("missing panel", id); return; }
  tl.to(el, { opacity: 1, duration: FADE }, a);
  if (b < DUR) tl.to(el, { opacity: 0, duration: FADE }, b - FADE);
});

tl.fromTo("#plant2", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 18.0);
/* the door: a wedge of stairwell light opens, then is let close softly */
tl.fromTo("#wedge", { width: 0 }, { width: 190, duration: 1.5, ease: "power2.out" }, 47.7);
tl.to("#wedge", { width: 0, duration: 2.6, ease: "power1.inOut" }, 50.4);
/* footsteps cross the light pools one at a time */
[56.1, 56.9, 57.7].forEach((t, i) => {
  tl.fromTo(`#pool${i + 1}`, { opacity: 0.13 }, { opacity: 0.46, duration: 0.2, yoyo: true, repeat: 1 }, t);
});
tl.fromTo("#halo", { opacity: 0.3 }, { opacity: 0.85, duration: 3.0, ease: "sine.inOut" }, 59.3);
/* "I know you're on four": the readout resolves to a fact nobody was told */
tl.to("#lvl", { duration: 1.1, scrambleText: { text: "LEVEL 4", chars: "0123456789", speed: 0.8, revealDelay: 0.35 } }, 59.5);
/* the recall lands as a stamp */
tl.fromTo("#brakestamp", { scale: 1.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.32, ease: "power3.out" }, 65.3);
/* the payoff: thirteenth car arrives, counter fails over to 13 */
tl.fromTo("#extra", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 71.6);
tl.to("#cnum", { duration: 0.85, scrambleText: { text: "13", chars: "0123456789", speed: 0.7, revealDelay: 0.3 } }, 71.5);
tl.fromTo("#cnum", { color: "#ffffff", scale: 1 }, { color: "#ff4242", scale: 1.3, duration: 0.4, ease: "power3.out" }, 71.9);

/* ---- HUD clock, stepping minute by minute ---- */
const S0 = 192, S1 = 220, AMPM = "AM";
const clockEl = document.getElementById("clock");
// seek(t, true) suppresses onUpdate as well as .call(), so neither survives a
// renderer grabbing frames out of order. Only tl.set() actually renders: it is
// a zero-duration tween, and tweens render at any playhead position.
for (let m = S0; m <= S1; m++){
  const at = ((m - S0) / Math.max(1, S1 - S0)) * (DUR - 4.0);
  tl.set(clockEl, { textContent:
    `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")} ${AMPM}` }, at);
}

const LINES = [["YOU <b>DROVE</b>.", 0.25, 1.95], ["LAST NIGHT, THE CAR PARK<br>KEPT YOU ALIVE.", 2.55, 5.75], ["TONIGHT, IT <u>COSTS YOU</u> SOMETHING.", 5.81, 8.36], ["<b>DAY 2</b>. LEVEL FOUR. ONE RAMP UP —<br>CONCRETE HAS <b>NO WINDOWS</b>.", 9.06, 14.435], ["YOU COASTED IN, ENGINE OFF.<br><b>NO BRAKES. NO LIGHTS.</b>", 14.495, 19.17], ["RECOVERY IN <b>NINE DAYS</b>.<br>STAY ABOVE STREET LEVEL.", 19.62, 25.12], ["RULE 1. <b>PARK FACING THE RAMP</b>.", 25.52, 28.545], ["RULE 2. SLEEP IN THE BACK SEAT.<br><b>NEVER THE DRIVER'S</b>.", 28.605, 32.93], ["RULE 3. <u>COUNT THE CARS</u><br>BEFORE DARK.", 32.99, 36.44], ["<b>GOOD NEWS</b>. ELEVEN CARS.<br>YOURS IS THE <b>TWELFTH</b>.", 37.14, 41.365], ["<u>BAD NEWS</u>. THE STAIRWELL DOOR<br>HAS NO LOCK. IT ONLY <b>CLOSES</b>.", 41.425, 46.4], ["<b>3:40 AM</b>. THE DOOR OPENS.<br>AND SOMEONE LETS IT CLOSE SOFTLY.", 47.0, 52.45], ["SOFTLY. SO IT WOULDN'T <u>BANG</u>.", 52.51, 55.06], ["FOOTSTEPS.<br>NOT SHUFFLING. <u>WALKING</u>.", 55.76, 58.61], ["“I KNOW YOU'RE ON FOUR.<br>I SAW YOUR BRAKE LIGHTS COME ON.”", 59.16, 63.26], ["YOU COASTED IN.<br>YOU <u>NEVER TOUCHED THE BRAKES</u>.", 63.96, 67.485], ["SO YOU COUNT THE CARS AGAIN.", 68.385, 70.885], ["<u>THIRTEEN</u>.", 71.735, 73.41], ["", 74.51, 76.735]];
const capEl = document.getElementById("cap");
LINES.forEach(([html, a, b], i) => {
  tl.set(capEl, { innerHTML: html }, a);   // render-time, survives seek
  tl.fromTo(capEl, { opacity: 0, y: 14 },
            { opacity: html ? 1 : 0, duration: 0.26, ease: "power2.out" }, a);
  const next = LINES[i + 1] ? LINES[i + 1][1] : DUR;
  tl.to(capEl, { opacity: 0, duration: 0.20 }, Math.min(b, next - 0.24));
});

window.__timelines = window.__timelines || {};
window.__timelines["td2"] = tl;
</script>
