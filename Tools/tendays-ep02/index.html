const rule = (n, text, sub) => `<div class="rulecard">
    <div class="rulebadge">RULE #${n}</div><div class="ruletext">${text}</div>
    ${sub ? `<div class="rulesub">${sub}</div>` : ""}</div>`;

/* A parking level in perspective: slab above, slab below, pillars receding.
   Deterministic throughout — the renderer seeks frames out of order. */
function level(litIndex){
  let h = "";
  for (let i = 0; i < 6; i++){
    const t = i / 5;
    const x = 120 + t * 430, w = 60 - t * 34, top = 620 + t * 120, hgt = 700 - t * 300;
    for (const side of [0, 1]){
      const px = side ? 1080 - x - w : x;
      h += `<div style="position:absolute;left:${px}px;top:${top}px;width:${w}px;height:${hgt}px;
             background:linear-gradient(90deg,#333c4e,#222a38);opacity:${1 - t*0.45};"></div>`;
    }
  }
  // parked cars down both sides, one of them lit
  for (let i = 0; i < 5; i++){
    const t = i / 4;
    const w = 300 - t * 180, hh = 120 - t * 72;
    const y = 1180 - t * 300;
    for (const side of [0, 1]){
      const x = side ? 1080 - (96 + t * 300) - w : 96 + t * 300;
      const lit = (i * 2 + side) === litIndex;
      h += `<div style="position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${hh}px;
             border-radius:${10 - t*5}px;background:${lit
               ? "linear-gradient(180deg,#4b4426,#2c2714)" : "linear-gradient(180deg,#2d384f,#1c2433)"};
             opacity:${0.95 - t*0.35};"></div>
            <div style="position:absolute;left:${x + w*0.16}px;top:${y - hh*0.40}px;
             width:${w*0.68}px;height:${hh*0.44}px;border-radius:${7-t*3}px ${7-t*3}px 0 0;
             background:${lit ? "#5c5230" : "#36425c"};opacity:${0.9 - t*0.35};"></div>`;
    }
  }
  return h;
}

const SH = [["recap", 0.0, 4.0], ["park", 3.8, 11.739999999999998], ["ramp", 11.54, 20.64], ["radio", 20.3, 24.91], ["rule1", 24.71, 28.28], ["rule2", 27.94, 31.91], ["rule3", 31.57, 35.92], ["good", 35.72, 40.35], ["bad", 40.01, 45.71], ["door", 45.51, 54.620000000000005], ["steps", 54.42, 58.440000000000005], ["voice", 58.24, 62.67], ["dash", 62.47, 66.75], ["count", 66.55, 72.39], ["end", 72.19, 76.6]];
const FADE = 0.30;
SH.forEach(([id, a, b]) => {
  const el = document.getElementById(id);
  if (!el) { console.warn("missing panel", id); return; }
  tl.to(el, { opacity: 1, duration: FADE }, a);
  if (b < DUR) tl.to(el, { opacity: 0, duration: FADE }, b - FADE);
});

tl.fromTo("#levelart", { scale: 1.00 }, { scale: 1.10, duration: 8.0, ease: "none" }, 3.9);
tl.fromTo("#wedge", { width: 0 }, { width: 190, duration: 1.5, ease: "power2.out" }, 44.4);
tl.to("#wedge", { width: 0, duration: 2.6, ease: "power1.inOut" }, 47.2);
[53.0, 54.0, 55.0].forEach((t, i) => {
  tl.fromTo(`#pool${i + 1}`, { opacity: 0.13 },
            { opacity: 0.44, duration: 0.22, yoyo: true, repeat: 1 }, t);
});
tl.fromTo("#halo", { opacity: 0.3 }, { opacity: 0.85, duration: 3.2, ease: "sine.inOut" }, 56.6);
/* the payoff: the thirteenth car arrives and the count turns red */
tl.fromTo("#extra", { opacity: 0, scale: 0.6 },
          { opacity: 1, scale: 1, duration: 0.40, ease: "power3.out" }, 69.6);
tl.to("#cnum", { duration: 0.85,
  scrambleText: { text: "13", chars: "0123456789", speed: 0.7, revealDelay: 0.3 } }, 69.3);
tl.fromTo("#cnum", { scale: 1, color: "#ffffff" },
          { scale: 1.3, color: "#ff4242", duration: 0.40, ease: "power3.out" }, 69.6);

/* ---- HUD clock, stepping minute by minute ---- */
const S0 = 192, S1 = 220, AMPM = "AM";
const clockEl = document.getElementById("clock");
// seek(t, true) suppresses onUpdate as well as .call(), so neither is safe for
// a renderer grabbing frames out of order. Only tl.set() actually renders —
// it is a zero-duration tween, and tweens render at any playhead position.
// One set() per minute is cheap and provably correct.
for (let m = S0; m <= S1; m++){
  const at = ((m - S0) / Math.max(1, S1 - S0)) * (DUR - 4.0);
  tl.set(clockEl, { textContent:
    `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")} ${AMPM}` }, at);
}

const LINES = [["YOU DIDN'T OPEN THE DOOR.<br>YOU <b>DROVE</b>.", 0.25, 3.3], ["A CAR PARK IS THE SAFEST PLACE<br>TO SLEEP IN AN OUTBREAK.", 4.0, 8.25], ["UNTIL YOU COUNT THE CARS <u>TWICE</u>.", 8.46, 11.085], ["<b>DAY 2</b>. LEVEL FOUR.<br>CONCRETE HAS <b>NO WINDOWS</b>.", 11.735, 15.91], ["HIGH ENOUGH OFF THE STREET.<br>LOW ENOUGH TO <b>DRIVE DOWN FAST</b>.", 15.97, 20.445], ["RECOVERY IN <b>NINE DAYS</b>.<br>STAY OFF THE GROUND FLOOR.", 20.505, 24.505], ["RULE 1. <b>PARK FACING THE EXIT</b>.", 24.905, 28.08], ["RULE 2. NEVER SLEEP IN<br>THE <b>DRIVER'S SEAT</b>.", 28.14, 31.715], ["RULE 3. <u>COUNT THE CARS</u><br>BEFORE DARK.", 31.775, 35.225], ["<b>GOOD NEWS</b>. ELEVEN CARS.<br>YOURS IS THE <b>TWELFTH</b>.", 35.925, 40.15], ["<u>BAD NEWS</u>. THE DOOR DOESN'T LOCK.<br>IT ONLY <b>CLOSES</b>.", 40.21, 45.11], ["<b>3:40 AM</b>. THE DOOR OPENS —<br>AND SOMEONE LETS IT CLOSE SOFTLY.", 45.71, 51.06], ["SOMEONE WHO DIDN'T WANT IT TO <u>BANG</u>.", 51.12, 53.87], ["THEN FOOTSTEPS.<br>NOT SHUFFLING. <u>WALKING</u>.", 54.62, 57.895], ["“I SAW YOUR BRAKE LIGHTS.<br>WHICH CAR ARE YOU IN?”", 58.445, 61.97], ["YOU HAVEN'T TOUCHED THE BRAKES<br>SINCE <u>YESTERDAY</u>.", 62.67, 65.845], ["SO YOU COUNT AGAIN.", 66.745, 68.77], ["<u>THIRTEEN</u>.", 69.62, 71.295], ["", 72.395, 74.62]];
