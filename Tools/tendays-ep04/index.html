<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Ten Days — Day 4</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
  :root{
    --night:#0b1220; --night2:#131d30; --road:#161d2b;
    --amber:#f0a93c; --amber-lt:#ffd38a; --warm:#ffb64d;
    --red:#ff4242; --red-dk:#c22b2b;
    --ink:#060a12; --white:#ffffff; --grey:#8b97ab;
  }
  html,body{margin:0;background:#000;}
  #root{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--night);
        font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;}
  .panel{position:absolute;inset:0;opacity:0;will-change:opacity;}
  #hud{position:absolute;left:46px;top:44px;z-index:40;}
  #daytag{display:flex;align-items:center;gap:9px;font-size:23px;font-weight:700;
          letter-spacing:2.4px;color:var(--red);}
  #daytag i{width:11px;height:11px;border-radius:50%;background:var(--red);display:block;}
  #clock{font-size:54px;font-weight:700;color:var(--white);letter-spacing:1px;margin-top:2px;
         font-variant-numeric:tabular-nums;}
  #recov{font-size:20px;font-weight:600;letter-spacing:2.6px;color:var(--grey);margin-top:1px;}
  #mark{position:absolute;right:46px;top:52px;z-index:40;font-size:18px;
        letter-spacing:1.6px;color:#55617a;}
  /* Captions sit above y=1500. Anything a panel draws below that collides with a
     two-line caption, which is a hard lint error — keep panel text above it. */
  #capwrap{position:absolute;left:70px;right:70px;bottom:230px;text-align:center;z-index:38;}
  #cap{display:inline-block;color:var(--white);font-size:58px;line-height:1.26;font-weight:700;
       letter-spacing:.4px;opacity:0;
       text-shadow:0 4px 22px rgba(0,0,0,.95),0 2px 4px rgba(0,0,0,.9);}
  #cap b{color:var(--amber);font-weight:700;}
  #cap u{color:var(--red);text-decoration:none;}
  .vign{position:absolute;inset:0;pointer-events:none;
        background:radial-gradient(125% 85% at 50% 45%,rgba(0,0,0,0) 42%,rgba(0,0,0,.82) 100%);}
  .sky{position:absolute;inset:0;
       background:linear-gradient(180deg,#0a1020 0%,#16233a 46%,#0c1322 100%);}
  .rulecard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
            justify-content:center;gap:34px;
            background:linear-gradient(180deg,rgba(6,10,18,.90),rgba(6,10,18,.96));}
  .rulebadge{background:var(--red);color:#fff;font-size:26px;font-weight:800;letter-spacing:3.4px;
             padding:11px 26px;border-radius:5px;}
  .ruletext{color:#fff;font-size:92px;font-weight:800;letter-spacing:1px;text-align:center;
            line-height:1.1;max-width:880px;}
  .rulesub{color:var(--grey);font-size:34px;font-weight:600;max-width:800px;text-align:center;
           line-height:1.35;}
  .news{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:830px;
        border:3px solid var(--amber);border-radius:12px;background:rgba(8,13,22,.93);
        padding:36px 40px;}
  .news.bad{border-color:var(--red);}
  .news h4{margin:0 0 22px;color:var(--amber);font-size:30px;letter-spacing:3.4px;font-weight:800;}
  .news.bad h4{color:var(--red);}
  .news .row{display:flex;justify-content:space-between;align-items:center;color:#fff;
             font-size:40px;font-weight:600;padding:15px 0;
             border-bottom:1px solid rgba(255,255,255,.10);}
  .news .row:last-child{border-bottom:0;}
  .news .row span:last-child{color:var(--amber);font-weight:800;}
  .news.bad .row span:last-child{color:var(--red);}
  .stamp{position:absolute;left:50%;transform:translateX(-50%) rotate(-7deg);border:7px solid var(--red);
         color:var(--red);font-size:80px;font-weight:800;letter-spacing:6px;padding:13px 42px;
         border-radius:8px;}
  .badge{display:inline-block;border:4px solid var(--amber);color:var(--amber);font-size:38px;
         font-weight:800;letter-spacing:4px;padding:14px 32px;border-radius:8px;
         background:rgba(8,12,20,.85);}
  .badge.red{border-color:var(--red);color:var(--red);}

</style>
  </head>
  <body>
<div id="root" data-composition-id="td4" data-start="0" data-duration="73.3"
     data-width="1080" data-height="1920" data-track-kind="graphics">
  <div id="panels" class="clip" data-start="0" data-duration="73.3" data-track-index="0"></div>
  <div id="hud" class="clip" data-start="0" data-duration="73.3" data-track-index="1" data-layout-ignore>
    <div id="daytag"><i></i>DAY 4 / 10</div>
    <div id="clock">12:40 AM</div>
    <div id="recov">RECOVERY IN 7 DAYS</div>
  </div>
  <div id="mark" class="clip" data-start="0" data-duration="73.3" data-track-index="2"
       data-layout-ignore>1min.thinker</div>
  <div id="capwrap" class="clip" data-start="0" data-duration="73.3" data-track-index="3"
       data-track-kind="captions"><span id="cap"></span></div>
</div>

<audio id="vo" src="assets/audio/vo.wav" data-start="0" data-volume="1"></audio>

<script>
const DUR = 73.3;
const tl = gsap.timeline({ paused: true });
const S = document.getElementById("panels");
const mk = (id, html) => { const d=document.createElement("div");
  d.className="panel"; d.id=id; d.innerHTML=html; S.appendChild(d); return d; };
const rule = (n, text, sub) => `<div class="rulecard">
    <div class="rulebadge">RULE #${n}</div><div class="ruletext">${text}</div>
    ${sub ? `<div class="rulesub">${sub}</div>` : ""}</div>`;

/* An empty A-road at night: verges converging, dashes running away from camera. */
function road(){
  let h = `<div style="position:absolute;left:0;right:0;top:0;height:700px;
            background:linear-gradient(180deg,#0a1020,#16233a);"></div>
           <div style="position:absolute;left:0;right:0;top:700px;bottom:0;
            background:linear-gradient(180deg,#1b2230,#0b0f17);"></div>`;
  h += `<svg width="1080" height="1920" style="position:absolute;inset:0;">
          <polygon points="-180,1920 1260,1920 640,700 440,700" fill="#171e2b"/>
          <line x1="-180" y1="1920" x2="440" y2="700" stroke="#3a4a66" stroke-width="6"/>
          <line x1="1260" y1="1920" x2="640" y2="700" stroke="#3a4a66" stroke-width="6"/>
        </svg>`;
  for (let i = 0; i < 11; i++){
    const t = i / 10;
    const y = 1920 - Math.pow(1 - t, 1.9) * 1180;
    const w = 26 - t * 20, len = 150 - t * 128;
    h += `<div style="position:absolute;left:${540 - w/2}px;top:${y - len}px;width:${w}px;
           height:${len}px;border-radius:4px;background:#5a6a86;opacity:${0.55 - t*0.34};"></div>`;
  }
  return h;
}

mk("recap", `<div style="position:absolute;inset:0;background:#06090f;"></div>
  <div style="position:absolute;inset:0;opacity:.4;">${road()}</div>
  <div class="stamp" style="top:800px;border-color:var(--amber);color:var(--amber);">OUT THE BACK</div>
  <div class="vign"></div>`);

mk("road", `<div style="position:absolute;inset:0;">${road()}</div>
  <div id="roadart" style="position:absolute;inset:0;"></div>
  <div class="vign"></div>`);

mk("follow", `<div style="position:absolute;inset:0;">${road()}</div>
  <!-- their headlights, held at a constant distance in your mirror -->
  <div id="lamps" style="position:absolute;left:430px;top:830px;width:220px;height:60px;">
    <div style="position:absolute;left:0;top:0;width:78px;height:40px;border-radius:20px;
         background:#fff3cf;box-shadow:0 0 70px 26px rgba(255,238,190,.40);"></div>
    <div style="position:absolute;right:0;top:0;width:78px;height:40px;border-radius:20px;
         background:#fff3cf;box-shadow:0 0 70px 26px rgba(255,238,190,.40);"></div>
  </div>
  <div style="position:absolute;left:0;right:0;top:1060px;text-align:center;">
    <span class="badge">400 METRES — FOR 60 MILES</span></div>
  <div class="vign"></div>`);

mk("radio", `<div style="position:absolute;inset:0;background:#070c16;"></div>
  <div id="radiobox" style="position:absolute;left:250px;top:760px;width:580px;height:290px;
       border-radius:16px;background:linear-gradient(180deg,#222d41,#161e2e);border:4px solid #33425e;">
    <div style="position:absolute;left:32px;top:30px;width:350px;height:108px;border-radius:8px;
         background:#0b2a21;border:3px solid #1d5742;display:flex;align-items:center;justify-content:center;">
      <span style="color:#5df2b0;font-size:56px;font-weight:800;letter-spacing:5px;">CH 09</span></div>
    <div style="position:absolute;right:34px;top:42px;width:86px;height:86px;border-radius:50%;
         background:#2b374f;border:4px solid #44557a;"></div>
    <div style="position:absolute;left:32px;bottom:28px;right:32px;height:56px;display:flex;gap:11px;">
      ${Array.from({length:10},()=>`<div style="flex:1;border-radius:5px;background:#2b374f;"></div>`).join("")}
    </div></div>
  <div class="vign"></div>`);

mk("rule1", rule(1, "NEVER DRIVE<br>STRAIGHT TO WHERE<br>YOU SLEEP", ""));
mk("rule2", rule(2, "NEVER LET A<br>STRANGER SEE<br>YOUR FUEL", ""));
mk("rule3", rule(3, "DO NOT STOP<br>ON OPEN ROAD", ""));

mk("good", `<div style="position:absolute;inset:0;background:#070c16;"></div>
  <div class="news"><h4>GOOD NEWS</h4>
    <div class="row"><span>Fuel remaining</span><span>90 MILES</span></div>
    <div class="row"><span>Gap they closed</span><span>NONE</span></div>
    <div class="row"><span>Hours followed</span><span>1.5</span></div></div>
  <div class="vign"></div>`);

mk("bad", `<div style="position:absolute;inset:0;background:#070c16;"></div>
  <!-- every road converging on a single crossing -->
  <svg width="1080" height="1920" style="position:absolute;inset:0;">
    ${[0,1,2,3,4].map(i=>{const x=120+i*210;
      return `<line x1="${x}" y1="430" x2="540" y2="1060" stroke="#3a4a66" stroke-width="7"/>`;}).join("")}
    <line x1="540" y1="1060" x2="540" y2="1520" stroke="#f0a93c" stroke-width="9"/>
  </svg>
  <div style="position:absolute;left:452px;top:1012px;width:176px;height:96px;border-radius:10px;
       border:5px solid var(--red);background:rgba(10,14,22,.9);"></div>
  <div style="position:absolute;left:0;right:0;top:1200px;text-align:center;">
    <span class="badge red">ONE BRIDGE</span></div>
  <div class="vign"></div>`);

mk("junction", `<div style="position:absolute;inset:0;">${road()}</div>
  <div id="dark" style="position:absolute;inset:0;background:#05080e;opacity:0;"></div>
  <div class="vign"></div>`);

mk("sos", `<div style="position:absolute;inset:0;background:#05080e;"></div>
  <!-- mirror view: their lamps, flashing the pattern -->
  <div style="position:absolute;left:190px;top:620px;width:700px;height:300px;border-radius:18px;
       border:6px solid #2d3850;background:#080d16;"></div>
  <div id="sosL" style="position:absolute;left:330px;top:730px;width:110px;height:60px;
       border-radius:30px;background:#fff3cf;opacity:.12;"></div>
  <div id="sosR" style="position:absolute;left:640px;top:730px;width:110px;height:60px;
       border-radius:30px;background:#fff3cf;opacity:.12;"></div>
  <div style="position:absolute;left:0;right:0;top:1010px;text-align:center;">
    <div style="display:inline-flex;gap:16px;align-items:center;">
      ${[1,1,1,0,0,0,1,1,1].map((lng,i)=>`<div style="width:${lng?54:20}px;height:18px;
        border-radius:9px;background:var(--amber);opacity:.9;"></div>`).join("")}
    </div>
    <div style="margin-top:26px;color:var(--red);font-size:44px;font-weight:800;
         letter-spacing:8px;">S.O.S.</div>
  </div>
  <div class="vign"></div>`);

mk("drive", `<div style="position:absolute;inset:0;">${road()}</div>
  <div style="position:absolute;left:0;right:0;top:1180px;text-align:center;">
    <span class="badge red">YOU KEEP DRIVING</span></div>
  <div class="vign"></div>`);

mk("out", `<div style="position:absolute;inset:0;background:#05080e;"></div>
  <div style="position:absolute;left:190px;top:620px;width:700px;height:300px;border-radius:18px;
       border:6px solid #2d3850;background:#080d16;"></div>
  <div id="outL" style="position:absolute;left:330px;top:730px;width:110px;height:60px;
       border-radius:30px;background:#fff3cf;box-shadow:0 0 60px 20px rgba(255,238,190,.35);"></div>
  <div id="outR" style="position:absolute;left:640px;top:730px;width:110px;height:60px;
       border-radius:30px;background:#fff3cf;box-shadow:0 0 60px 20px rgba(255,238,190,.35);"></div>
  <div class="vign"></div>`);


/* ---- end card: the question, the buttons, and the next day's hook ---- */
mk("end", `<div style="position:absolute;inset:0;
       background:radial-gradient(90% 60% at 50% 46%,#2a0b0b 0%,#07090f 72%);"></div>
  <div style="position:absolute;left:0;right:0;top:690px;text-align:center;">
    <div style="color:#fff;font-size:84px;font-weight:800;">DID YOU JUST LEAVE</div>
    <div style="color:var(--red);font-size:84px;font-weight:800;">SOMEONE TO DIE?</div>
  </div>
  <div style="position:absolute;left:0;right:0;top:980px;display:flex;justify-content:center;gap:34px;">
    <div style="background:var(--amber);color:#1a1205;font-size:38px;font-weight:800;
         padding:20px 52px;border-radius:10px;letter-spacing:2px;">YES</div>
    <div style="background:var(--red-dk);color:#fff;font-size:38px;font-weight:800;
         padding:20px 52px;border-radius:10px;letter-spacing:2px;">NO</div>
  </div>
  <div style="position:absolute;left:0;right:0;top:1160px;text-align:center;">
    <div style="color:#7d879b;font-size:26px;letter-spacing:4px;">DAY 5</div>
    <div style="color:#fff;font-size:44px;font-weight:800;margin-top:10px;">THEIR LIGHTS DIDN'T FADE.<br>THEY WENT OUT.</div>
    <div style="color:var(--amber);font-size:27px;letter-spacing:3px;margin-top:22px;">
      FOLLOW FOR DAY 5</div>
  </div>`);

const SH = [["recap", 0.0, 2.9200000000000004], ["road", 2.72, 9.809999999999999], ["follow", 9.61, 17.61], ["radio", 17.41, 21.79], ["rule1", 21.59, 25.79], ["rule2", 25.45, 29.65], ["rule3", 29.31, 33.71], ["good", 33.51, 37.09], ["bad", 36.74, 41.74], ["junction", 41.54, 46.440000000000005], ["sos", 46.24, 58.13], ["drive", 57.93, 60.980000000000004], ["out", 60.78, 68.53], ["end", 68.33, 73.3]];
const FADE = 0.30;
SH.forEach(([id, a, b]) => {
  const el = document.getElementById(id);
  if (!el) { console.warn("missing panel", id); return; }
  tl.to(el, { opacity: 1, duration: FADE }, a);
  if (b < DUR) tl.to(el, { opacity: 0, duration: FADE }, b - FADE);
});

tl.fromTo("#lamps", { scale: 0.96, opacity: 0.85 },
          { scale: 1.04, opacity: 1, duration: 8.6, ease: "none" }, 13.3);
tl.to("#dark", { opacity: 0.86, duration: 0.14, ease: "none" }, 43.6);
/* The pattern, flashed for real: 3 long, 3 short, 3 long.
   Each pulse is a fromTo at BOTH ends. A plain .to() records its start value on
   first render, and the renderer seeks frames out of order, so chained .to()
   tweens on one property silently flatten into no visible flash at all. */
(() => {
  const T = ["#sosL", "#sosR"], DIM = 0.10, LIT = 1;
  const pat = [[0.00,0.50],[0.72,0.50],[1.44,0.50],
               [2.34,0.16],[2.74,0.16],[3.14,0.16],
               [3.86,0.50],[4.58,0.50],[5.30,0.50]];
  pat.forEach(([o, len]) => {
    tl.fromTo(T, { opacity: DIM }, { opacity: LIT, duration: 0.05, ease: "none" }, 50.6 + o);
    tl.fromTo(T, { opacity: LIT }, { opacity: DIM, duration: 0.05, ease: "none" }, 50.6 + o + len);
  });
})();

/* their lights do not dim. they stop. */
tl.fromTo(["#outL","#outR"], { opacity: 1 }, { opacity: 0, duration: 0.08, ease: "none" }, 63.4);

/* ---- HUD clock, stepping minute by minute ---- */
const S0 = 40, S1 = 77, AMPM = "AM";
const clockEl = document.getElementById("clock");
// seek(t, true) suppresses onUpdate as well as .call(), so neither is safe for
// a renderer grabbing frames out of order. Only tl.set() actually renders —
// it is a zero-duration tween, and tweens render at any playhead position.
// One set() per minute is cheap and provably correct.
for (let m = S0; m <= S1; m++){
  const at = ((m - S0) / Math.max(1, S1 - S0)) * (DUR - 4.0);
  tl.set(clockEl, { textContent:
    `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")} ${AMPM}` }, at);
}

const LINES = [["YOU WENT OUT THE <b>BACK</b>.", 0.25, 2.225], ["ON DAY 4 YOU MEET<br>ANOTHER <b>SURVIVOR</b>.", 2.92, 6.195], ["MORE DANGEROUS THAN<br>MEETING THE <u>DEAD</u>.", 6.255, 9.205], ["HEADLIGHTS. <b>400 METRES</b> BACK.<br>FOR SIXTY MILES.", 9.805, 14.28], ["YOU SLOW DOWN.<br><u>THEY SLOW DOWN</u>.", 14.34, 17.065], ["RECOVERY IN <b>SEVEN DAYS</b>.<br>DO NOT CONVOY.", 17.615, 21.39], ["RULE 1. NEVER DRIVE STRAIGHT<br>TO WHERE YOU <b>SLEEP</b>.", 21.79, 25.59], ["RULE 2. NEVER LET A STRANGER<br>SEE YOUR <b>FUEL</b>.", 25.65, 29.45], ["RULE 3. <u>DO NOT STOP<br>ON OPEN ROAD</u>.", 29.51, 33.06], ["<b>GOOD NEWS</b>. 90 MILES OF FUEL.", 33.71, 36.885], ["<u>BAD NEWS</u>. EVERY ROAD SOUTH<br>ENDS AT <b>ONE BRIDGE</b>.", 36.945, 41.195], ["<b>1:17 AM</b>. YOU KILL YOUR LIGHTS<br>AND TURN OFF.", 41.745, 45.795], ["BEHIND YOU, THEY <b>STOP</b>.<br>AND FLASH THEIR HEADLIGHTS.", 46.445, 50.37], ["THREE LONG. THREE SHORT.<br>THREE LONG.", 50.43, 53.38], ["THAT'S NOT A THREAT.<br>THAT'S <u>S.O.S.</u>", 54.13, 57.28], ["AND YOU <u>KEEP DRIVING</u>.", 58.13, 60.18], ["THIRTY SECONDS LATER<br>THEIR LIGHTS GO <u>OUT</u>.", 60.98, 64.38], ["AND THEY DON'T <u>COME BACK ON</u>.", 65.03, 67.48], ["", 68.53, 71.255]];
const capEl = document.getElementById("cap");
LINES.forEach(([html, a, b], i) => {
  tl.set(capEl, { innerHTML: html }, a);   // set() renders; call() does not
  tl.fromTo(capEl, { opacity: 0, y: 14 },
            { opacity: html ? 1 : 0, duration: 0.26, ease: "power2.out" }, a);
  const next = LINES[i + 1] ? LINES[i + 1][1] : DUR;
  tl.to(capEl, { opacity: 0, duration: 0.20 }, Math.min(b, next - 0.24));
});

window.__timelines = window.__timelines || {};
window.__timelines["td4"] = tl;
</script>

</html>
